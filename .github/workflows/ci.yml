name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package:vscode
      - run: npm run pack:pi:dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: pi-vscode-context-vsix
          path: packages/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 14
