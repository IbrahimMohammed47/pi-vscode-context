name: Recover Release

run-name: Recover v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version to recover
        required: true
        default: 0.1.0
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Validate version input
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version such as 0.1.0; received $VERSION."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/verify-version.js "$TAG"
      - run: npm test
      - run: npm run check
      - run: npm run package:vscode
      - run: npm run pack:pi
      - name: Verify publishing credentials
        run: node scripts/verify-release-auth.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish missing registry packages
        run: node scripts/publish-release.js "$VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Create GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              "pi-vscode-context-$VERSION.tgz#Pi extension npm package" \
              "packages/vscode-extension/pi-vscode-context-vscode-$VERSION.vsix#VS Code extension" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
